name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/assets/fonts _site/assets/vendor deps
          cp -r site/public/. _site/
          find _site -name '*.b64' | while read f; do base64 -d "$f" > "${f%.b64}"; rm "$f"; done
          npm install --prefix deps --no-audit --no-fund gsap@3.15.0 lenis@1.3.26 @fontsource/instrument-serif@5.3.0 @fontsource-variable/inter-tight@5.3.0 @fontsource/jetbrains-mono@5.3.0
          N=deps/node_modules
          cp $N/gsap/dist/gsap.min.js $N/gsap/dist/ScrollTrigger.min.js $N/lenis/dist/lenis.min.js _site/assets/vendor/
          cp $N/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2 $N/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2 _site/assets/fonts/
          cp $N/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2 _site/assets/fonts/
          cp $N/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2 _site/assets/fonts/
          node site/src/build.mjs _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
